<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset password | Super Care Dry Cleaners</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <h1>Super Care Dry Cleaners</h1>

    <main>
        <section class="auth-card">
            <h2>Choose a new password</h2>

            <p id="reset-status">Checking your reset link...</p>

            <form id="reset-form" novalidate hidden>
                <label for="new-password">New password</label>
                <div class="password-wrap">
                    <input type="password" id="new-password" autocomplete="new-password" minlength="6" required>
                    <button type="button" class="toggle-pass" aria-label="Show password">Show password</button>
                </div>

                <label for="confirm-new-password">Confirm new password</label>
                <div class="password-wrap">
                    <input type="password" id="confirm-new-password" autocomplete="new-password" required>
                    <button type="button" class="toggle-pass" aria-label="Show password">Show password</button>
                </div>

                <p class="password-hint">
                    Use at least 6 characters with a capital letter, a small letter and a number.
                </p>

                <p id="reset-message" class="auth-message" role="alert" hidden></p>

                <button type="submit" id="reset-submit">Save new password</button>
            </form>

            <p class="auth-back"><a href="login.html">Back to log in</a></p>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="reset-password.js"></script>
</body>
</html>
